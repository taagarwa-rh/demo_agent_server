# OpenShift Template for NPS Agent
#
# Deploy with:
#   oc process -f demo-agent-server.yaml \
#     -p NAMESPACE="$NAMESPACE" \
#     -p MLFLOW_TRACKING_URI="$MLFLOW_TRACKING_URI" \
#     -p MLFLOW_WORKSPACE="$MLFLOW_WORKSPACE" \
#     -p MLFLOW_EXPERIMENT_NAME="$MLFLOW_EXPERIMENT_NAME" \
#     | oc apply -f -
#
# Secret is created manually via:
#   oc create secret generic demo-agent-server-secrets \
#     --from-literal=OPENAI_API_KEY='...' \
#     --from-literal=NPS_API_KEY='...' \
#     -n $NAMESPACE
apiVersion: template.openshift.io/v1
kind: Template
metadata:
  name: demo-agent-server-template
parameters:
  - name: NAMESPACE
    description: Your OpenShift project name (e.g., demo-agent-server-yourname)
    required: true
  - name: MLFLOW_TRACKING_URI
    description: Your RHOAI MLflow URL (e.g., https://data-science-gateway.apps.<cluster>/mlflow/)
    required: true
  - name: MLFLOW_EXPERIMENT_NAME
    description: Experiment name in MLflow
    value: demo-agent-server
objects:
  - apiVersion: build.openshift.io/v1
    kind: BuildConfig
    metadata:
      name: demo-agent-server
      namespace: ${NAMESPACE}
    spec:
      source:
        type: Git
        git:
          uri: https://github.com/taagarwa-rh/demo_agent_server.git
          ref: feat/agent-card
      strategy:
        dockerStrategy:
          dockerfilePath: Containerfile
      output:
        to:
          kind: ImageStreamTag
          name: demo-agent-server:latest
      triggers:
        - type: ConfigChange
  - apiVersion: image.openshift.io/v1
    kind: ImageStream
    metadata:
      name: demo-agent-server
      namespace: ${NAMESPACE}
  - apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: demo-agent-server
      namespace: ${NAMESPACE}
      labels:
        app: demo-agent-server
    spec:
      replicas: 1
      selector:
        matchLabels:
          app: demo-agent-server
      template:
        metadata:
          labels:
            app: demo-agent-server
        spec:
          containers:
            - name: demo-agent-server
              image: image-registry.openshift-image-registry.svc:5000/${NAMESPACE}/demo-agent-server:latest
              args:
                - "uv"
                - "run"
                - "start_server.py"
                - "--port"
                - "8080"
              ports:
                - containerPort: 8080
                  protocol: TCP
              envFrom:
                - secretRef:
                    name: demo-agent-server-secret
              env:
                - name: MLFLOW_TRACKING_URI
                  value: "${MLFLOW_TRACKING_URI}"
                - name: MLFLOW_TRACKING_AUTH
                  value: "kubernetes"
                - name: MLFLOW_EXPERIMENT_NAME
                  value: "${MLFLOW_EXPERIMENT_NAME}"
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
              readinessProbe:
                httpGet:
                  path: /health
                  port: 8080
                initialDelaySeconds: 30
                periodSeconds: 10
              livenessProbe:
                httpGet:
                  path: /health
                  port: 8080
                initialDelaySeconds: 60
                periodSeconds: 30
  - apiVersion: v1
    kind: Service
    metadata:
      name: demo-agent-server
      namespace: ${NAMESPACE}
      labels:
        app: demo-agent-server
    spec:
      selector:
        app: demo-agent-server
      ports:
        - port: 8080
          targetPort: 8080
          protocol: TCP
  - apiVersion: route.openshift.io/v1
    kind: Route
    metadata:
      name: demo-agent-server
      namespace: ${NAMESPACE}
      labels:
        app: demo-agent-server
      annotations:
        haproxy.router.openshift.io/timeout: 300s
    spec:
      to:
        kind: Service
        name: demo-agent-server
      port:
        targetPort: 8080
      tls:
        termination: edge
